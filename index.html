<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F7F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voca.">
<title>Voca.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:'Pretendard';src:url('PretendardVariable.woff2') format('woff2');font-weight:45 920;font-display:swap}
:root{
  --bg:#F2F7F3; --card:#FFFFFF; --line:#DDE9E1; --line2:#EBF1ED; --ink:#13201A; --muted:#56685D; --faint:#7D8C83;
  --green:#0F7B4F; --green-soft:#E3F3EA; --grey-soft:#EEF2EF; --red:#C6432A; --red-line:#E2553A; --red-soft:#FDEDE8; --red-ink:#B23A22;
  --pad:20px; --pady:max(28px, env(safe-area-inset-top));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{scrollbar-width:thin;scrollbar-color:rgba(19,32,26,.14) transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(19,32,26,.14);border-radius:2px}
::-webkit-scrollbar-button{display:none;height:0;width:0}
.back{scrollbar-color:rgba(255,255,255,.28) transparent}
.back::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28)}
.list{scrollbar-gutter:auto}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Pretendard',system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit}
.app{position:relative;width:100%;max-width:480px;height:100dvh;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;gap:20px;
  padding:max(28px, calc(env(safe-area-inset-top) + 12px)) var(--pad) max(28px, calc(env(safe-area-inset-bottom) + 12px));
  transition:transform .32s cubic-bezier(.2,.8,.2,1), opacity .32s}
.view.hidden{pointer-events:none}
#home.hidden{transform:translateX(-24%);opacity:0}
#book.hidden{transform:translateX(100%)}
#book,#search{background:var(--bg)}
#search.hidden{transform:translateX(100%)}
.sbox{flex:1;min-width:0;height:44px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px}
.sbox svg{width:18px;height:18px;color:var(--faint);flex:none}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.sbox input::placeholder{color:var(--faint)}
.sres{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sres .list{flex:none;overflow:hidden}
.srow{width:100%;display:block;text-align:left;border:0;background:#fff;padding:14px 20px;cursor:pointer}
.srow+.srow,.srow+.sdet,.sdet+.srow{border-top:1px solid var(--line2)}
.srow .rw{font-size:18px;font-weight:700;letter-spacing:-.3px}
.srow .rm{font-size:13px;color:var(--muted);margin-top:2px}
.sdet{padding:4px 20px 18px;background:#fff;display:flex;flex-direction:column;gap:12px}
.sdet .dm{display:flex;flex-direction:column;gap:4px}
.sdet .dm span{font-size:15px;color:var(--muted);line-height:1.45}
.sdet .dm span.key{font-size:18px;font-weight:700;color:var(--ink)}
.sdet .dm span.key i{font-style:normal;background:linear-gradient(transparent 62%,var(--green-soft) 62%)}
.sdet .dr{display:flex;flex-direction:column;gap:6px}
.sdet .dr div{display:flex;align-items:baseline;gap:8px;font-size:14px;line-height:1.45}
.sdet .dr .lb{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--grey-soft);color:var(--muted)}
.sdet .dr em{font-style:normal;color:var(--muted)}
.sdet .dx{background:var(--grey-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sdet .dx .en{font-size:15px;line-height:1.5}
.sdet .dx .ko{font-size:13px;color:var(--muted);line-height:1.5}
.sadd{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.sadd .go{width:100%;height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;border:0;background:#fff;color:var(--green);font-size:16px;font-weight:700;cursor:pointer;text-align:left}
.sadd .go svg{width:20px;height:20px;flex:none}
.sadd form{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.sadd input{height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);background:#fff;outline:none}
.sadd input:focus{border-color:var(--green)}
.sadd input::placeholder{color:var(--faint)}
.sadd .save{height:46px;border:0;border-radius:8px;background:var(--green);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.sadd .save:disabled{background:#B9D5C6}
.sdel{align-self:flex-start;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none}
.count{display:flex;align-items:baseline;gap:6px}
.count small{font-size:14px;color:var(--muted)}
.count b{font-size:22px;font-weight:700;letter-spacing:-.3px}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;border:0;background:transparent;cursor:pointer;color:var(--ink)}
.icon:active{background:var(--grey-soft)}
.icon svg{width:24px;height:24px}

/* deck */
.stage{flex:1;position:relative;perspective:1400px;min-height:0;margin-bottom:12px}
.under{display:none}
.side{position:absolute;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:24px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);pointer-events:none}
.side svg{width:22px;height:22px}
.side.yes{left:6px;color:var(--green);background:var(--green-soft)}
.side.no{right:6px;color:var(--muted);background:var(--grey-soft)}
.side.up{top:auto;bottom:-6px;left:50%;margin:0 0 0 -24px;color:var(--muted);background:var(--grey-soft)}
.card.flipped{touch-action:pan-y}
.card{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;cursor:grab;z-index:1}
.card .tint{position:absolute;inset:0;border-radius:10px;pointer-events:none;opacity:0;z-index:2}
.card:focus-visible .front{outline:3px solid rgba(15,123,79,.35);outline-offset:2px}
.card.enter{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.card.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px}
.front{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(19,32,26,.04),0 12px 32px rgba(15,123,79,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center}
.tag{position:absolute;top:22px;left:22px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;color:var(--muted);background:var(--grey-soft)}
.tag.new{color:var(--green);background:var(--green-soft)}
.word{font-size:clamp(36px,12vw,50px);font-weight:700;letter-spacing:-1.2px;line-height:1.1;word-break:break-word}
.speak{position:absolute;top:12px;right:12px;z-index:2}
.speak svg{width:22px;height:22px;color:var(--muted);transition:color .2s}
.card.flipped .speak svg{color:#fff}
.opt:focus:not(:focus-visible),.card:focus:not(:focus-visible){outline:none}
.back{transform:rotateY(180deg);background:var(--green);color:#fff;box-shadow:0 12px 32px rgba(15,123,79,.22);display:flex;flex-direction:column;gap:20px;padding:28px 24px 24px;overflow-y:auto;overscroll-behavior:contain}
.back .bw{font-size:17px;font-weight:600;flex:none}
.back .bm{display:flex;flex-direction:column;gap:8px;flex:none}
.back .mean{font-size:17px;font-weight:500;line-height:1.4;color:#E6F4EC;word-break:keep-all}
.back .mean.key{font-size:clamp(23px,7vw,28px);font-weight:700;letter-spacing:-.5px;color:#fff}
.back .mean.key span{background:linear-gradient(transparent 62%,rgba(255,255,255,.22) 62%);padding:0 1px}
.back .rel{display:flex;flex-direction:column;gap:8px;flex:none;border-top:1px solid rgba(255,255,255,.18);padding-top:16px}
.back .ri{display:flex;align-items:baseline;gap:10px;font-size:15px;line-height:1.45}
.back .ri .lb{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.18);color:#fff;transform:translateY(-1px)}
.back .ri b{font-weight:700}
.back .ri em{font-style:normal;color:#E6F4EC}
.back .ex{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.12);border-radius:8px;padding:18px;margin-top:auto;flex:none}
.back .ex .en{font-size:16px;font-weight:500;line-height:1.5}
.back .ex .ko{font-size:13px;line-height:1.55}


/* quiz */
.quiz{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(19,32,26,.04),0 12px 32px rgba(15,123,79,.08);display:flex;flex-direction:column;padding:22px 20px 20px}
.quiz .qtag{align-self:flex-start;font-size:12px;font-weight:700;color:#fff;background:var(--green);padding:4px 10px;border-radius:999px}
.quiz .q{flex:1;display:flex;align-items:center;padding:8px 4px}
.quiz .q p{margin:0;font-size:clamp(20px,6.2vw,24px);font-weight:600;line-height:1.5;letter-spacing:-.4px}
.quiz .q .big{font-size:clamp(36px,11vw,46px);font-weight:700;letter-spacing:-1px;width:100%;text-align:center}
.blank{display:inline-block;min-width:100px;padding:0 6px;border-radius:8px;background:var(--grey-soft);color:var(--green);text-align:center}
.blank.on{background:var(--green-soft)}
.opts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.opt{min-height:60px;display:flex;align-items:center;gap:14px;padding:12px 18px;border:0;background:#fff;text-align:left;cursor:pointer;font-size:17px;font-weight:600;transition:background .2s,color .2s}
.opt+.opt{border-top:1px solid var(--line)}
.opt .n{width:24px;height:24px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--grey-soft);color:var(--muted)}
.opt.right{background:var(--green);color:#fff}.opt.right .n{background:#fff;color:var(--green)}
.opt.wrong{background:var(--red-soft);color:var(--red-ink)}.opt.wrong .n{background:#fff;color:var(--red-ink)}
.opt.dim{color:var(--faint)}

/* wordbook */
.title{font-size:17px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#E3ECE6;padding:4px;border-radius:10px;flex:none}
.seg button{height:44px;border-radius:7px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(19,32,26,.08)}
.seg button b{font-weight:700}
.seg button.on b{color:var(--green)}
.due{font-size:13px;font-weight:600;color:var(--faint);letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.due:not(:empty)::before{content:'';width:6px;height:6px;border-radius:3px;background:var(--green);opacity:.7}
.sheetbg{position:absolute;inset:0;background:rgba(19,32,26,.18);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.sheet{position:absolute;left:12px;right:12px;bottom:max(12px, env(safe-area-inset-bottom));background:var(--card);border-radius:10px;overflow:hidden;transform:translateY(calc(100% + 40px));transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:41;box-shadow:0 12px 32px rgba(15,123,79,.12)}
.sheet.on{transform:none}.sheetbg.on{opacity:1;pointer-events:auto}
.srow{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;padding:0 18px;border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.srow+.srow{border-top:1px solid var(--line2)}
.srow:active{background:var(--grey-soft)}
.srow em{font-style:normal;font-size:13px;font-weight:500;color:var(--faint)}
.toast{position:absolute;left:50%;bottom:max(32px, calc(env(safe-area-inset-bottom) + 20px));transform:translate(-50%,10px);background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tgroup{display:flex;gap:2px;margin-right:-10px}
#book.hidden,#test.hidden{transform:translateX(100%)}
#test{background:var(--bg);z-index:3}
.bar{display:flex;align-items:center;justify-content:space-between;flex:none;height:36px}
.modes{display:flex;gap:2px}
.modes button{height:32px;padding:0 12px;border-radius:7px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.modes button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(19,32,26,.08)}
.tbtn{height:32px;padding:0 14px;border-radius:7px;border:0;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.brow{display:flex;align-items:center;gap:4px;padding:0 6px 0 20px;min-height:64px}
.brow+.brow{border-top:1px solid var(--line2)}
.fbox{flex:1;min-width:0;position:relative;height:48px;perspective:700px;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.fbox .fb{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.3,.7,.2,1)}
.fbox.on .fb{transform:rotateX(180deg)}
.fbox .fs{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;min-width:0}
.fbox .fs.b{transform:rotateX(180deg)}
.fbox .rw{font-size:18px;font-weight:700;letter-spacing:-.3px}
.fbox .rm{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbox .rk{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbox .hid{display:block;width:72px;height:10px;border-radius:5px;background:var(--grey-soft)}
.cnt{flex:none;font-size:12px;font-weight:700;color:var(--muted);min-width:20px;text-align:right}
.star svg{width:20px;height:20px;color:var(--faint)}
.star.on svg{color:var(--green);fill:var(--green)}
.favb{position:absolute;top:12px;right:56px;z-index:2}
.favb svg{width:22px;height:22px;color:var(--muted);transition:color .2s}
.favb.on svg{color:var(--green);fill:var(--green)}
.card.flipped .favb svg{color:#fff}
.card.flipped .favb.on svg{fill:#fff}
.tstage{flex:1;position:relative;min-height:0;margin-bottom:12px}
.tprog{font-size:15px;font-weight:700;color:var(--muted)}
.tend{position:absolute;inset:0;display:flex;flex-direction:column;gap:20px}
.score{flex:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px 20px;text-align:center}
.score b{font-size:48px;font-weight:700;letter-spacing:-1px}
.score span{font-size:20px;font-weight:600;color:var(--muted)}
.tend .list{flex:1}
.tacts{display:flex;gap:8px;flex:none}
.tacts button{flex:1;height:52px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.tacts .pri{border:0;background:var(--green);color:#fff}
.tacts .sec{border:1px solid var(--line);background:#fff;color:var(--ink)}
.list{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}
.row+.row{border-top:1px solid var(--line2)}
.row .rw{font-size:18px;font-weight:700;letter-spacing:-.3px}
.row .rm{font-size:13px;color:var(--muted);margin-top:2px}
.badge{flex:none;font-size:12px;font-weight:700;min-width:26px;height:26px;padding:0 8px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.badge.hard{color:var(--red-ink);background:var(--red-soft)}
.badge.done{color:var(--green);background:var(--green-soft)}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">

  <section id="home" class="view" aria-label="단어 카드">
    <div class="top">
      <span class="due" id="due"></span>
      <div class="tgroup">
      <button class="icon" id="openSearch" aria-label="검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      </button>
      <button class="icon" id="openBook" aria-label="단어장">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 1 5 16V4.5z"/><path d="M9 9h6M9 12.5h4"/></svg>
      </button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="under" id="under" aria-hidden="true"></div>
      <div class="side yes" id="sideYes" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div class="side up" id="sideUp" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.2 2.3-2.4 3.5M6.6 6.6C4.4 8 2.8 10.2 2 12c1 2.5 5 7 10 7 1.8 0 3.4-.5 4.8-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></div>
      <div class="side no" id="sideNo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7L7 17"/></svg></div>
    </div>
    <p class="sr" aria-live="polite" id="live"></p>
  </section>

  <section id="book" class="view hidden" aria-label="단어장" aria-hidden="true">
    <div class="top">
      <button class="icon" id="closeBook" aria-label="단어 카드로 돌아가기" style="margin-left:-10px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="title">단어장</span>
      <button class="icon" id="openBackup" aria-label="백업" style="margin-right:-10px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 15.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2.5"/></svg>
      </button>
    </div>
    <div class="seg" role="tablist">
      <button role="tab" data-tab="hard" class="on">헷갈림 <b id="nHard">0</b></button>
      <button role="tab" data-tab="done">외움 <b id="nDone">0</b></button>
      <button role="tab" data-tab="fav">즐겨찾기 <b id="nFav">0</b></button>
    </div>
    <div class="bar">
      <div class="modes" role="group" aria-label="보기 방식">
        <button data-mode="both" class="on">같이</button>
        <button data-mode="en">영어만</button>
        <button data-mode="ko">뜻만</button>
      </div>
      <button class="tbtn" id="startTest">시험</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <div class="sheetbg" id="sheetbg" aria-hidden="true"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="백업" aria-hidden="true">
    <button class="srow" id="bkSave"><span>백업 저장</span><em id="bkLast"></em></button>
    <button class="srow" id="bkLoad"><span>백업 불러오기</span></button>
    <input type="file" id="bkFile" accept="application/json,.json" hidden>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>

  <section id="test" class="view hidden" aria-label="시험" aria-hidden="true">
    <div class="top">
      <button class="icon" id="closeTest" aria-label="시험 닫기" style="margin-left:-10px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <span class="tprog" id="tprog"></span>
      <span style="width:44px"></span>
    </div>
    <div class="tstage" id="tstage"></div>
  </section>

  <section id="search" class="view hidden" aria-label="검색" aria-hidden="true">
    <div class="top" style="gap:6px">
      <button class="icon" id="closeSearch" aria-label="단어 카드로 돌아가기" style="margin-left:-10px;flex:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <label class="sbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" placeholder="단어나 뜻" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="단어 검색">
      </label>
    </div>
    <div class="sres"><div class="sadd" id="sadd" style="display:none"></div><div class="list" id="sres" style="display:none"></div></div>
  </section>
</div>

<script>
(() => {
  // ---------- 상태 ----------
  // words[w] = [box, due(ms), wrongCount, seenCount]
  const DAY = 864e5;
  const INTERVAL = [0, 1, 4, 10, 30, 90]; // box별 다음 복습까지 일 수 (알아 = 확실히 알 때만 누르니까 간격을 넓게)
  const KNOWN_BOX = 3;                  // 이 칸 이상이면 '외움'
  const QUIZ_EVERY = 8;
  const LS_KEY = 'suneung-vocab-v1';

  let BASE = [], WORDS = [], BY = {};
  // 기본 단어 + 내가 추가한 단어를 한 묶음으로
  function mergeWords() {
    const seen = new Set(BASE.map(x => x.w));
    WORDS = BASE.concat((S.custom || []).filter(x => x && x.w && !seen.has(x.w)));
    BY = {}; for (const x of WORDS) BY[x.w] = x;
    buildOrder();
  }
  let S = blank();
  let relearn = [];      // [{w, at}] 이번에 몰라로 넘긴 단어 → 몇 장 뒤 다시
  let quizLeft = 0, quizDone = [];
  let counter = 0, sinceQuiz = 0, current = null, lastW = null;

  function blank() { return { v: 1, words: {}, day: '', n: 0, updatedAt: 0, seed: 0, fav: {}, custom: [] }; }
  const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z"/></svg>';
  function toggleFav(w) { if (S.fav[w]) delete S.fav[w]; else S.fav[w] = Date.now(); save(); }
  // 새 단어 순서: 사람마다 고정된 무작위 순서 (단어를 추가해도 사이사이 섞여 들어감)
  let ORDER = [];
  function hash(str, seed) { let h = 2166136261 ^ seed; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function buildOrder() {
    if (!S.seed) S.seed = (Math.random() * 4294967295) >>> 0 || 1;
    ORDER = WORDS.map(x => x.w).sort((a, b) => hash(a, S.seed) - hash(b, S.seed));
  }
  function keyMean(x) { const k = x.m.find(m => m[0] === '*') || x.m[0]; return k.replace(/^\*/, ''); }
  function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  }
  function save() {
    S.updatedAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  }

  // ---------- 다음 카드 고르기 (끝없이) ----------
  // 카드 섞는 비율: 몰라 단어만 계속 나오지 않게
  let lastKind = '', sinceNew = 0;
  const RELEARN_GAP_MIN = 6, RELEARN_GAP_MAX = 10;   // 몰라 → 6~10장 뒤 다시
  const NEW_EVERY = 3;                                // 새 단어는 최소 3장에 한 번
  function countDue() {
    const now = Date.now(); let n = 0;
    for (const x in S.words) { if (BY[x] && S.words[x][1] <= now) n++; }
    return n;
  }
  function showDue() {
    const n = countDue();
    const el = document.getElementById('due');
    if (el) el.textContent = n > 0 ? '복습 ' + n : '';
  }
  // 퀴즈 대상: 자주 몰라 한 단어 위주 (숨긴 단어·오래 외운 단어 제외)
  function quizTarget(skip) {
    const c = []; let tot = 0;
    for (const x in S.words) {
      const st = S.words[x];
      if (!BY[x] || skip.includes(x) || st[0] >= 4) continue;
      const wt = (1 + st[2] * 2) * (st[0] <= 1 ? 2 : 1);
      c.push([x, wt]); tot += wt;
    }
    if (!c.length) return null;
    let r = Math.random() * tot;
    for (const [x, wt] of c) { r -= wt; if (r <= 0) return x; }
    return c[c.length - 1][0];
  }
  // 오답 보기: 혼동어 → 같은 품사 → (빈칸이면) 철자 비슷한 단어
  const POS = {};
  function pos(x) {
    if (POS[x.w]) return POS[x.w];
    const m = keyMean(x).split(/[,;(]/)[0].trim();
    let p = 'n';
    if (/다$/.test(m)) p = 'v';
    else if (/(한|인|은|운|된|는|있는|없는|적인|스러운|로운)$/.test(m)) p = 'a';
    else if (/(게|히)$/.test(m)) p = 'r';
    return (POS[x.w] = p);
  }
  function distractors(x, blankMode) {
    const out = [], used = new Set([x.w]), km = keyMean(x);
    const add = o => { if (o && !used.has(o.w) && keyMean(o) !== km && out.length < 3) { out.push(o); used.add(o.w); } };
    shuffle((x.r || []).filter(r => r[0] === '혼동' || (!blankMode && r[0] === '반의'))).forEach(r => add(BY[r[1]]));
    for (const o of WORDS) { if (out.length >= 3) break; if ((o.r || []).some(r => r[0] === '혼동' && r[1] === x.w)) add(o); }
    const p = pos(x), w = x.w;
    const pool = shuffle(WORDS.filter(o => !used.has(o.w) && pos(o) === p)).slice(0, 240);
    const score = o => {
      let sc = Math.random();
      if (blankMode) {
        if (o.w.slice(0, 2) === w.slice(0, 2)) sc += 2;
        if (o.w.slice(-3) === w.slice(-3)) sc += 2;
        if (Math.abs(o.w.length - w.length) <= 2) sc += 1;
      } else if (S.words[o.w]) sc += 1.5;
      return sc;
    };
    pool.map(o => [o, score(o)]).sort((a, b) => b[1] - a[1]).forEach(([o]) => add(o));
    shuffle(WORDS.slice()).forEach(add);
    return out;
  }
  function pickWord() {
    const now = Date.now();
    const pending = w => relearn.some(r => r.w === w);
    const fresh = () => ORDER.find(w => !S.words[w] && w !== lastW && !pending(w));
    let w = null, kind = '';
    // 1) 방금 몰라로 넘긴 단어 (연달아 나오지는 않게)
    if (lastKind !== 'relearn') {
      const ri = relearn.findIndex(r => r.at <= counter && r.w !== lastW);
      if (ri >= 0) { w = relearn.splice(ri, 1)[0].w; kind = 'relearn'; }
    }
    // 2) 새 단어 차례면 새 단어 (복습이 밀려 있으면 새 단어를 줄임)
    const dueN = countDue();
    const newEvery = dueN >= 30 ? Infinity : dueN >= 10 ? NEW_EVERY * 2 : NEW_EVERY;
    if (!w && sinceNew >= newEvery - 1) { const f = fresh(); if (f) { w = f; kind = 'new'; } }
    // 3) 복습할 때가 된 단어 (오래된 순)
    if (!w) {
      let due = null;
      for (const x in S.words) {
        const st = S.words[x];
        if (!BY[x] || x === lastW || st[1] > now || pending(x)) continue;
        if (!due || st[1] < S.words[due][1]) due = x;
      }
      if (due) { w = due; kind = 'review'; }
    }
    // 4) 새 단어
    if (!w) { const f = fresh(); if (f) { w = f; kind = 'new'; } }
    // 5) 남은 몰라 단어
    if (!w && relearn.length) { const ri = relearn.findIndex(r => r.w !== lastW); if (ri >= 0) { w = relearn.splice(ri, 1)[0].w; kind = 'relearn'; } }
    // 6) 다 봤으면 다음 복습이 가장 가까운 단어부터
    if (!w) {
      for (const x in S.words) {
        if (!BY[x] || x === lastW) continue;
        if (!w || S.words[x][1] < S.words[w][1]) w = x;
      }
      kind = 'review';
    }
    lastKind = kind;
    sinceNew = kind === 'new' ? 0 : sinceNew + 1;
    return w || WORDS[0].w;
  }

  function next() {
    counter++;
    if (quizLeft === 0 && sinceQuiz >= QUIZ_EVERY && quizTarget([])) {
      quizLeft = 2 + Math.floor(Math.random() * 2); // 한 번에 2~3문제
      quizDone = [];
    }
    const target = quizLeft > 0 ? quizTarget(quizDone.concat(lastW ? [lastW] : [])) : null;
    if (target) {
      quizLeft--; sinceQuiz = 0;
      quizDone.push(target);
      renderQuiz(target);
    } else {
      quizLeft = 0;
      sinceQuiz++;
      const w = pickWord();
      renderCard(w);
    }
    showDue();
  }

  // 알아 = 무조건 안다 (강한 신호) / 몰라 = 모름·애매함·다시 보고 싶음 (약한 신호)
  function mark(w, known) {
    const isNew = !S.words[w];
    const st = S.words[w] || [0, 0, 0, 0];
    st[3]++;
    if (known) {
      // 처음 보자마자 확실히 아는 단어는 바로 10일 뒤로, 아니면 한 칸씩
      st[0] = isNew ? KNOWN_BOX : Math.min(st[0] + 1, INTERVAL.length - 1);
      st[1] = Date.now() + INTERVAL[st[0]] * DAY;
    } else {
      // 처음부터 다시가 아니라 쌓아 둔 걸 절반만 깎음 (애매해서 누른 경우를 고려)
      st[0] = Math.floor(st[0] / 2);
      st[2]++;
      const wait = st[0] > 0 ? INTERVAL[st[0]] * DAY / 2 : 20 * 60 * 1000;
      st[1] = Date.now() + wait;
      relearn = relearn.filter(r => r.w !== w);
      relearn.push({ w, at: counter + RELEARN_GAP_MIN + Math.floor(Math.random() * (RELEARN_GAP_MAX - RELEARN_GAP_MIN + 1)) });
    }
    S.words[w] = st;
    bumpToday();
    save();
  }
  function bumpToday() {
    const k = todayKey();
    if (S.day !== k) { S.day = k; S.n = 0; }
    S.n++;
  }

  // ---------- 단어 카드 ----------
  const stage = document.getElementById('stage');
  const under = document.getElementById('under');
  const live = document.getElementById('live');

  function clearCard() { const old = stage.querySelector('.card'); if (old) old.remove(); }

  function renderCard(w) {
    clearCard();
    const x = BY[w], st = S.words[w];
    current = { type: 'word', w };
    lastW = w;
    const el = document.createElement('div');
    el.className = 'card enter';
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', w + ', 탭하면 뜻');
    el.innerHTML =
      '<div class="flip">' +
        '<div class="face front">' +
          '<span class="tag ' + (st ? '' : 'new') + '">' + (st ? '복습' : 'NEW') + '</span>' +
          '<span class="word">' + esc(w) + '</span>' +
        '</div>' +
        '<div class="face back">' +
          '<span class="bw">' + esc(w) + '</span>' +
          '<div class="bm">' + x.m.map(m => m[0] === '*'
              ? '<span class="mean key"><span>' + esc(m.slice(1)) + '</span></span>'
              : '<span class="mean">' + esc(m) + '</span>').join('') + '</div>' +
          (x.r && x.r.length ? '<div class="rel">' + x.r.map(r =>
              '<div class="ri"><span class="lb">' + esc(r[0]) + '</span><span><b>' + esc(r[1]) + '</b>' + (r[2] ? ' <em>' + esc(r[2]) + '</em>' : '') + '</span></div>'
            ).join('') + '</div>' : '') +
          (x.e ? '<div class="ex"><span class="en">' + esc(x.e) + '</span>' + (x.k ? '<span class="ko">' + esc(x.k) + '</span>' : '') + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<button class="icon favb' + (S.fav[w] ? ' on' : '') + '" aria-label="즐겨찾기" aria-pressed="' + !!S.fav[w] + '">' + STAR + '</button>' +
      '<button class="icon speak" aria-label="발음 듣기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>' +
      '<span class="tint" aria-hidden="true"></span>';
    stage.appendChild(el);
    bindSwipe(el, w);
    const sp = el.querySelector('.speak');
    sp.addEventListener('pointerdown', e => e.stopPropagation());
    sp.addEventListener('click', e => { e.stopPropagation(); speak(w); });
    const fb = el.querySelector('.favb');
    fb.addEventListener('pointerdown', e => e.stopPropagation());
    fb.addEventListener('click', e => { e.stopPropagation(); toggleFav(w); fb.classList.toggle('on', !!S.fav[w]); fb.setAttribute('aria-pressed', !!S.fav[w]); });
  }

  function speak(text) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.9;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }

  function bindSwipe(el, w) {
    const tint = el.querySelector('.tint'), sy = document.getElementById('sideYes'), sn = document.getElementById('sideNo'), su = document.getElementById('sideUp');
    let x0 = 0, y0 = 0, dx = 0, dy = 0, down = false, moved = false, done = false, axis = '';
    const show = (on, t, anim) => {
      [sy, sn, su].forEach(s => {
        s.style.transition = anim ? 'opacity .25s, transform .25s' : 'none';
        const v = s === on ? t : 0;
        s.style.opacity = v; s.style.transform = 'scale(' + (0.6 + 0.4 * v) + ')';
      });
    };
    const setX = (v, anim) => {
      el.style.transition = anim ? 'transform .28s cubic-bezier(.2,.8,.2,1)' : 'none';
      el.style.transform = 'translateX(' + v + 'px) rotate(' + (v / 22) + 'deg)';
      const p = Math.min(Math.abs(v) / 110, 1);
      show(v > 0 ? sy : sn, anim && Math.abs(v) > 200 ? 1 : (v === 0 ? 0 : p), anim);
      tint.style.transition = anim ? 'opacity .25s' : 'none';
      tint.style.background = v > 0 ? 'rgba(15,123,79,.035)' : 'rgba(19,32,26,.03)';
      tint.style.opacity = v === 0 ? 0 : p;
    };
    const setY = (v, anim) => {
      el.style.transition = anim ? 'transform .28s cubic-bezier(.2,.8,.2,1)' : 'none';
      el.style.transform = 'translateY(' + v + 'px)';
      const p = Math.min(Math.abs(v) / 110, 1);
      show(su, anim && Math.abs(v) > 200 ? 1 : (v === 0 ? 0 : p), anim);
      tint.style.transition = anim ? 'opacity .25s' : 'none';
      tint.style.background = 'rgba(19,32,26,.03)';
      tint.style.opacity = v === 0 ? 0 : p;
    };
    const reset = () => { if (axis === 'y') setY(0, true); else setX(0, true); };
    const fling = (dir) => {
      if (done) return; done = true;
      setX(dir * (window.innerWidth + 120), true);
      mark(w, dir > 0);
      live.textContent = dir > 0 ? '알아' : '몰라';
      setTimeout(() => { show(null, 0, false); next(); }, 230);
    };
    const flingUp = () => {
      if (done) return; done = true;
      setY(-(window.innerHeight + 120), true);
      markEasy(w);
      live.textContent = '다시 안 보기';
      setTimeout(() => { show(null, 0, false); next(); }, 230);
    };
    el.addEventListener('pointerdown', e => {
      if (done) return;
      down = true; moved = false; axis = ''; x0 = e.clientX; y0 = e.clientY; dx = dy = 0;
      el.classList.remove('enter');
      // 뒷면에서는 세로 스크롤을 위해 캡처하지 않음
      if (!el.classList.contains('flipped')) { try { el.setPointerCapture(e.pointerId); } catch (err) {} }
    });
    el.addEventListener('pointermove', e => {
      if (!down) return;
      dx = e.clientX - x0; dy = e.clientY - y0;
      if (!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        moved = true;
        axis = Math.abs(dx) >= Math.abs(dy) ? 'x' : (el.classList.contains('flipped') ? 'scroll' : 'y');
      }
      if (axis === 'x') setX(dx, false);
      else if (axis === 'y') setY(Math.min(dy, 0), false);
    });
    const end = (e) => {
      if (!down) return; down = false;
      if (e && e.type === 'pointercancel') { reset(); return; }
      if (!moved) { el.classList.toggle('flipped'); return; }
      if (axis === 'x' && Math.abs(dx) > 90) fling(dx > 0 ? 1 : -1);
      else if (axis === 'y' && dy < -100) flingUp();
      else if (axis !== 'scroll') reset();
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.classList.toggle('flipped'); }
      else if (e.key === 'ArrowRight') fling(1);
      else if (e.key === 'ArrowLeft') fling(-1);
      else if (e.key === 'ArrowUp') { e.preventDefault(); flingUp(); }
    });
  }

  // 위로 밀기: 너무 쉬운 단어 → 다시 안 나옴 (외움 탭에 들어감)
  function markEasy(w) {
    const st = S.words[w] || [0, 0, 0, 0];
    st[0] = INTERVAL.length - 1; st[1] = Date.now() + 3650 * DAY; st[3]++;
    S.words[w] = st;
    relearn = relearn.filter(r => r.w !== w);
    bumpToday(); save();
  }

  // ---------- 퀴즈 카드 ----------
  function renderQuiz(w) {
    clearCard();
    const x = BY[w];
    current = { type: 'quiz', w };
    lastW = w;
    const re = new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
    const blankMode = re.test(x.e) && Math.random() < 0.7;
    const opts = shuffle([x, ...distractors(x, blankMode)]);
    const el = document.createElement('div');
    el.className = 'card enter';
    el.style.cursor = 'default';
    let q;
    if (blankMode) {
      const parts = x.e.split(re);
      q = '<p>' + esc(parts[0]) + '<span class="blank" id="blank">&nbsp;</span>' + esc(parts.slice(1).join(w)) + '</p>';
    } else {
      q = '<p class="big">' + esc(w) + '</p>';
    }
    el.innerHTML =
      '<div class="quiz">' +
        '<span class="qtag">QUIZ</span>' +
        '<div class="q">' + q + '</div>' +
        '<div class="opts">' + opts.map((o, i) =>
          '<button class="opt" data-w="' + esc(o.w) + '"><span class="n">' + (i + 1) + '</span><span>' + esc(blankMode ? o.w : keyMean(o)) + '</span></button>'
        ).join('') + '</div>' +
      '</div>';
    stage.appendChild(el);
    let answered = false;
    el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (answered) return; answered = true;
      const ok = b.dataset.w === w;
      el.querySelectorAll('.opt').forEach(o => {
        if (o.dataset.w === w) o.classList.add('right');
        else if (o === b) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      const bl = el.querySelector('#blank');
      if (bl) { bl.textContent = w; bl.classList.add('on'); }
      live.textContent = ok ? '정답' : '오답, 정답은 ' + w;
      if (!ok) mark(w, false); else save();
      setTimeout(next, ok ? 900 : 1600);
    }));
  }

  // ---------- 단어장 ----------
  const home = document.getElementById('home'), book = document.getElementById('book');
  let tab = 'hard';
  function openBook(on) {
    home.classList.toggle('hidden', on); book.classList.toggle('hidden', !on);
    home.setAttribute('aria-hidden', on); book.setAttribute('aria-hidden', !on);
    if (on) { renderBook(); document.getElementById('closeBook').focus({ preventScroll: true }); }
    else { const c = stage.querySelector('.card'); if (c) c.focus({ preventScroll: true }); }
  }
  let mode = 'both';
  function plainAll(w) { return BY[w].m.map(m => m.replace(/^\*/, '')).join(', '); }
  function bookLists() {
    const hard = [], done = [];
    for (const w in S.words) {
      if (!BY[w]) continue;
      const st = S.words[w];
      if (st[0] >= KNOWN_BOX) done.push(w);
      else if (st[2] > 0) hard.push(w);
    }
    hard.sort((a, b) => S.words[b][2] - S.words[a][2]);
    done.sort((a, b) => S.words[b][0] - S.words[a][0] || a.localeCompare(b));
    const fav = Object.keys(S.fav).filter(w => BY[w]).sort((a, b) => S.fav[b] - S.fav[a]);
    return { hard, done, fav };
  }
  function renderBook() {
    const L = bookLists();
    document.getElementById('nHard').textContent = L.hard.length;
    document.getElementById('nDone').textContent = L.done.length;
    document.getElementById('nFav').textContent = L.fav.length;
    const items = L[tab];
    document.getElementById('startTest').style.visibility = items.length ? 'visible' : 'hidden';
    const list = document.getElementById('list');
    if (!items.length) { list.innerHTML = '<div class="empty">아직 없어요</div>'; return; }
    list.innerHTML = items.map(w => {
      const en = '<span class="rw">' + esc(w) + '</span>';
      const ko = '<span class="rk">' + esc(plainAll(w)) + '</span>';
      let inner;
      if (mode === 'both') inner = '<span class="fs">' + en + '<span class="rm">' + esc(plainAll(w)) + '</span></span>';
      else inner = '<span class="fs">' + (mode === 'en' ? en : ko) + '</span><span class="fs b">' + (mode === 'en' ? ko : en) + '</span>';
      return '<div class="brow">' +
        '<button class="fbox" data-w="' + esc(w) + '"' + (mode === 'both' ? ' tabindex="-1"' : ' aria-label="' + esc(w) + ' 뒤집기"') + '><span class="fb">' + inner + '</span></button>' +
        (tab === 'hard' ? '<span class="cnt" aria-label="몰라 횟수">' + S.words[w][2] + '</span>' : '') +
        '<button class="icon star' + (S.fav[w] ? ' on' : '') + '" data-w="' + esc(w) + '" aria-label="즐겨찾기" aria-pressed="' + !!S.fav[w] + '">' + STAR + '</button>' +
      '</div>';
    }).join('');
  }
  document.getElementById('list').addEventListener('click', e => {
    const st = e.target.closest('.star');
    if (st) {
      toggleFav(st.dataset.w);
      if (tab === 'fav') renderBook();
      else { st.classList.toggle('on', !!S.fav[st.dataset.w]); st.setAttribute('aria-pressed', !!S.fav[st.dataset.w]); document.getElementById('nFav').textContent = bookLists().fav.length; }
      return;
    }
    const fb = e.target.closest('.fbox');
    if (fb && mode !== 'both') fb.classList.toggle('on');
  });
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
    renderBook();
  }));
  document.getElementById('openBook').addEventListener('click', () => openBook(true));
  document.getElementById('closeBook').addEventListener('click', () => openBook(false));
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
    renderBook();
  }));

  // ---------- 시험 ----------
  const testV = document.getElementById('test'), tstage = document.getElementById('tstage'), tprog = document.getElementById('tprog');
  let T = null;
  function openTest(on) {
    testV.classList.toggle('hidden', !on); testV.setAttribute('aria-hidden', !on);
    book.setAttribute('aria-hidden', on);
    if (!on) { T = null; renderBook(); }
  }
  function startTest(words) {
    T = { list: shuffle(words.slice()), i: 0, wrong: [], right: 0 };
    openTest(true); testQ();
  }
  function testQ() {
    if (!T) return;
    if (T.i >= T.list.length) return testEnd();
    const w = T.list[T.i], x = BY[w];
    tprog.textContent = (T.i + 1) + ' / ' + T.list.length;
    const pool = WORDS.filter(o => o.w !== w && keyMean(o) !== keyMean(x));
    const opts = shuffle([x, ...shuffle(pool).slice(0, 3)]);
    tstage.innerHTML = '<div class="quiz">' +
      '<div class="q"><p class="big">' + esc(w) + '</p></div>' +
      '<div class="opts">' + opts.map((o, i) => '<button class="opt" data-w="' + esc(o.w) + '"><span class="n">' + (i + 1) + '</span><span>' + esc(keyMean(o)) + '</span></button>').join('') + '</div></div>';
    let answered = false;
    tstage.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (answered || !T) return; answered = true;
      const ok = b.dataset.w === w;
      tstage.querySelectorAll('.opt').forEach(o => o.classList.add(o.dataset.w === w ? 'right' : (o === b ? 'wrong' : 'dim')));
      if (ok) T.right++; else { T.wrong.push(w); mark(w, false); }
      live.textContent = ok ? '정답' : '오답';
      T.i++;
      setTimeout(testQ, ok ? 700 : 1300);
    }));
  }
  function testEnd() {
    tprog.textContent = '';
    const n = T.list.length;
    tstage.innerHTML = '<div class="tend">' +
      '<div class="score"><b>' + T.right + '</b> <span>/ ' + n + '</span></div>' +
      (T.wrong.length ? '<div class="list">' + T.wrong.map(w => '<div class="row"><div><div class="rw">' + esc(w) + '</div><div class="rm">' + esc(plainAll(w)) + '</div></div></div>').join('') + '</div>' : '<div style="flex:1"></div>') +
      '<div class="tacts">' + (T.wrong.length ? '<button class="sec" id="tRetry">틀린 것만 다시</button>' : '') + '<button class="pri" id="tDone">완료</button></div>' +
    '</div>';
    const r = document.getElementById('tRetry');
    if (r) r.addEventListener('click', () => startTest(T.wrong));
    document.getElementById('tDone').addEventListener('click', () => openTest(false));
  }
  document.getElementById('startTest').addEventListener('click', () => { const items = bookLists()[tab]; if (items.length) startTest(items); });
  document.getElementById('closeTest').addEventListener('click', () => openTest(false));

  // ---------- 검색 ----------
  const search = document.getElementById('search'), qIn = document.getElementById('q'), sres = document.getElementById('sres');
  let openW = null;
  function openSearch(on) {
    home.classList.toggle('hidden', on); search.classList.toggle('hidden', !on);
    home.setAttribute('aria-hidden', on); search.setAttribute('aria-hidden', !on);
    if (on) { renderSearch(); setTimeout(() => { qIn.focus({ preventScroll: true }); document.querySelector('.app').scrollLeft = 0; }, 340); }
    else { qIn.blur(); }
  }
  function plain(m) { return m.replace(/^\*/, ''); }
  let addOpen = false;
  const sadd = document.getElementById('sadd');
  const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  function renderAdd(q) {
    const ok = /^[a-z][a-z' -]{0,40}$/.test(q) && !BY[q];
    if (!ok) { sadd.style.display = 'none'; sadd.innerHTML = ''; addOpen = false; return; }
    sadd.style.display = '';
    if (!addOpen) { sadd.innerHTML = '<button class="go" id="addGo">' + PLUS + '<span>' + esc(q) + '</span></button>'; return; }
    sadd.innerHTML = '<button class="go" id="addGo" aria-expanded="true">' + PLUS + '<span>' + esc(q) + '</span></button>' +
      '<form id="addForm" autocomplete="off">' +
        '<input id="addM" placeholder="뜻" aria-label="뜻" required>' +
        '<input id="addE" placeholder="예문" aria-label="예문" autocapitalize="sentences">' +
        '<button class="save" id="addSave" disabled>추가</button>' +
      '</form>';
    const m = document.getElementById('addM'), sv = document.getElementById('addSave');
    m.addEventListener('input', () => { sv.disabled = !m.value.trim(); });
    setTimeout(() => m.focus({ preventScroll: true }), 30);
    document.getElementById('addForm').addEventListener('submit', ev => {
      ev.preventDefault();
      const mean = m.value.trim(); if (!mean) return;
      const parts = mean.split(/\s*[,;]\s*/).filter(Boolean);
      const x = { w: q, m: ['*' + parts[0]].concat(parts.slice(1)), r: [], e: document.getElementById('addE').value.trim(), k: '', mine: 1 };
      S.custom = (S.custom || []).filter(c => c.w !== q).concat([x]);
      mergeWords(); save();
      addOpen = false; openW = q; renderSearch();
    });
  }
  function renderSearch() {
    const q = qIn.value.trim().toLowerCase();
    renderAdd(q);
    if (!q) { sres.style.display = 'none'; sres.innerHTML = ''; return; }
    const starts = [], has = [], mean = [];
    for (const x of WORDS) {
      if (x.w.startsWith(q)) starts.push(x);
      else if (x.w.includes(q)) has.push(x);
      else if (x.m.some(m => plain(m).includes(q)) || (x.r || []).some(r => r[1].toLowerCase().includes(q))) mean.push(x);
    }
    const items = starts.concat(has, mean).slice(0, 60);
    if (!items.length) { sres.style.display = 'none'; sres.innerHTML = ''; return; }
    sres.style.display = '';
    sres.innerHTML = items.map(x => {
      const row = '<button class="srow" data-w="' + esc(x.w) + '" aria-expanded="' + (openW === x.w) + '"><div class="rw">' + esc(x.w) + '</div><div class="rm">' + esc(x.m.map(plain).join(', ')) + '</div></button>';
      if (openW !== x.w) return row;
      return row + '<div class="sdet">' +
        '<div class="dm">' + x.m.map(m => m[0] === '*' ? '<span class="key"><i>' + esc(plain(m)) + '</i></span>' : '<span>' + esc(m) + '</span>').join('') + '</div>' +
        (x.r && x.r.length ? '<div class="dr">' + x.r.map(r => '<div><span class="lb">' + esc(r[0]) + '</span><span><b>' + esc(r[1]) + '</b>' + (r[2] ? ' <em>' + esc(r[2]) + '</em>' : '') + '</span></div>').join('') + '</div>' : '') +
        (x.e ? '<div class="dx"><span class="en">' + esc(x.e) + '</span>' + (x.k ? '<span class="ko">' + esc(x.k) + '</span>' : '') + '</div>' : '') +
        (x.mine ? '<button class="sdel" data-del="' + esc(x.w) + '">삭제</button>' : '') +
      '</div>';
    }).join('');
  }
  qIn.addEventListener('input', () => { openW = null; renderSearch(); });
  sadd.addEventListener('click', e => {
    if (e.target.closest('#addGo')) { addOpen = !addOpen; renderAdd(qIn.value.trim().toLowerCase()); }
  });
  sres.addEventListener('click', e => {
    const d = e.target.closest('.sdel');
    if (d) {
      const w = d.dataset.del;
      S.custom = (S.custom || []).filter(c => c.w !== w);
      delete S.words[w]; delete S.fav[w];
      relearn = relearn.filter(r => r.w !== w);
      mergeWords(); save(); openW = null; renderSearch();
      return;
    }
    const b = e.target.closest('.srow'); if (!b) return;
    openW = openW === b.dataset.w ? null : b.dataset.w;
    qIn.blur(); renderSearch();
  });
  document.getElementById('openSearch').addEventListener('click', () => openSearch(true));
  document.getElementById('closeSearch').addEventListener('click', () => openSearch(false));

  // ---------- 백업 ----------
  const sheet = document.getElementById('sheet'), sheetbg = document.getElementById('sheetbg'), bkFile = document.getElementById('bkFile');
  let toastT;
  function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
  }
  function openSheet(on) {
    sheet.classList.toggle('on', on); sheetbg.classList.toggle('on', on);
    sheet.setAttribute('aria-hidden', on ? 'false' : 'true');
    if (on) {
      const d = S.backupAt ? new Date(S.backupAt) : null;
      document.getElementById('bkLast').textContent = d ? (d.getMonth() + 1) + '/' + d.getDate() : '';
    }
  }
  document.getElementById('openBackup').addEventListener('click', () => openSheet(true));
  sheetbg.addEventListener('click', () => openSheet(false));
  document.getElementById('bkSave').addEventListener('click', async () => {
    S.backupAt = Date.now(); save();
    const name = 'voca-backup-' + todayKey() + '.json';
    const file = new File([JSON.stringify({ app: 'voca', v: 1, at: Date.now(), state: S })], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); openSheet(false); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    openSheet(false);
  });
  document.getElementById('bkLoad').addEventListener('click', () => bkFile.click());
  bkFile.addEventListener('change', async () => {
    const f = bkFile.files[0]; bkFile.value = '';
    if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      const st = j && j.state ? j.state : j;
      if (!st || typeof st.words !== 'object') throw 0;
      applyState(st); mergeWords(); relearn = []; quizLeft = 0; save();
      renderBook(); next();
      openSheet(false); toast('불러왔어요');
    } catch (e) { toast('백업 파일이 아니에요'); }
  });

  // ---------- 시작 ----------
  function applyState(st) {
    if (!st || typeof st !== 'object' || !st.words) return;
    S = { ...blank(), ...st };
    if (!S.fav || typeof S.fav !== 'object') S.fav = {};
    if (!Array.isArray(S.custom)) S.custom = [];
    if (S.day !== todayKey()) { S.day = todayKey(); S.n = 0; }
  }

  applyState(loadLocal());
  fetch('words.json').then(r => r.json()).then(list => {
    BASE = list;
    mergeWords(); save();
    next();
  }).catch(() => {
    stage.insertAdjacentHTML('beforeend', '<div class="quiz" style="align-items:center;justify-content:center;color:var(--faint)">단어를 불러오지 못했어요</div>');
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
</script>
</body>
</html>
